packages:
  - apps/*
  - packages/*

catalog:
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  klarity: 0.3.0
  lefthook: 2.2.2
  oxfmt: 0.75.0
  oxlint: 1.90.0
  turbo: 2.11.10
  "@types/node": 24.19.2
  typescript: 7.0.2

saveExact: true
strictPeerDependencies: true
autoInstallPeers: false

allowBuilds:
  esbuild: true
  lefthook: true
  # Downloads the CLI binary the source map upload uses.
  "@posthog/cli": true
  core-js: false
minimumReleaseAgeExclude:
  - lucide-react@1.63.0
  - effect@4.0.7
  - "@effect-kit/redis@0.1.1"
  - "@effect-kit/emails@0.1.0"
  - "@hugeicons/core-free-icons@4.4.0"
  - "@posthog/browser-common@0.10.1"
  - "@posthog/core@1.61.2"
  - "@posthog/types@1.418.0"
  - posthog-js@1.441.2
  - posthog-node@5.59.0
