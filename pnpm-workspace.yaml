packages:
  - apps/*
  - packages/*

catalog:
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  klarity: 0.3.0
  lefthook: 2.2.2
  oxfmt: 0.75.0
  oxlint: 1.90.0
  turbo: 2.11.10
  "@types/node": 24.19.2
  typescript: 7.0.2

saveExact: true
strictPeerDependencies: true
autoInstallPeers: false

allowBuilds:
  esbuild: true
  lefthook: true
minimumReleaseAgeExclude:
  - lucide-react@1.63.0
  - effect@4.0.7
  - "@effect-kit/redis@0.1.0"
  - "@effect-kit/emails@0.1.0"
